name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pca
          POSTGRES_PASSWORD: pca_password
          POSTGRES_DB: phone_commerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pca -d phone_commerce"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      ENVIRONMENT: test
      DEBUG: false
      DATABASE_URL: postgresql+asyncpg://pca:pca_password@localhost:5432/phone_commerce
      EVAL_DATABASE_URL: postgresql+asyncpg://pca:pca_password@localhost:5432/phone_commerce_eval
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://pca:pca_password@localhost:5432/phone_commerce_migration_test
      BOOTSTRAP_TEST_DATABASE_URL: postgresql+asyncpg://pca:pca_password@localhost:5432/phone_commerce_bootstrap_test
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      EMBEDDING_MODEL: bge-m3
      EMBEDDING_DIM: '1024'
      KB_DOCS_DIR: ${{ github.workspace }}/data/kb-docs
      JWT_SECRET_KEY: ci-test-secret-do-not-use-in-prod
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install service readiness clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools
      - name: Wait for Postgres and Redis
        run: |
          for i in {1..30}; do pg_isready -h localhost -p 5432 -U pca && break; sleep 2; done
          pg_isready -h localhost -p 5432 -U pca
          for i in {1..30}; do redis-cli -h localhost -p 6379 ping | grep -q PONG && break; sleep 2; done
          redis-cli -h localhost -p 6379 ping | grep -q PONG
      - name: Create destructive integration databases
        env:
          PGPASSWORD: pca_password
        run: |
          for database in phone_commerce_migration_test phone_commerce_bootstrap_test; do
            if ! psql -h localhost -U pca -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${database}'" | grep -q 1; then
              psql -h localhost -U pca -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${database}"
            fi
          done
      - name: Bootstrap main and eval databases
        working-directory: backend
        run: python scripts/bootstrap.py
      - name: Run all tests
        working-directory: backend
        run: pytest -v --tb=short --maxfail=5 --durations=10
      - name: Run 100-sample Mock evaluation
        working-directory: backend
        run: |
          mkdir -p reports
          python -m eval.run_eval --output-dir reports --fail-on-errors
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_number }}-${{ github.run_id }}
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 30
      - name: Print eval summary on failure
        if: failure()
        working-directory: backend
        run: |
          {
            echo "## Eval summary (last attempt)"
            echo ""
            ls -la reports/ 2>/dev/null || echo "_No reports/_"
            python - <<'PY' 2>/dev/null || true
          import json, glob, os
          for f in sorted(glob.glob('reports/*.json')):
              with open(f, encoding='utf-8') as fh: r = json.load(fh)
              print('- Report:', os.path.basename(f))
              print('  - Total:', r.get('total'), '/ Succeeded:', r.get('succeeded'), '/ Failed:', r.get('failed'))
              print('  - Metrics:', r.get('metrics', {}))
              print('  - Owner Isolation:', r.get('owner_isolation', {}))
              print('  - Errors:', len(r.get('errors') or []))
          PY
          } >> "$GITHUB_STEP_SUMMARY"
